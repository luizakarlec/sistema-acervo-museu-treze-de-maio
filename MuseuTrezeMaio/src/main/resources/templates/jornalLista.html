<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Jornais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
<div class="container mt-4">
    <div class="row me-0">
        <div class="col-md-10 bg-light p-3 rounded shadow-sm">
            <h1>Lista de Jornais</h1>

            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Título</th>
                    <th>Data</th>
                    <th>Editora</th>
                    <th>Situação</th>
                    <th>Editar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="jornal : ${jornais}">
                    <td th:text="${jornal.codigoJornal}"></td>

                    <td th:text="${jornal.titulo}"></td>

                    <td th:text="${#dates.format(jornal.data, 'dd/MM/yyyy')}"></td>

                    <td th:text="${jornal.editora != null ? jornal.editora.nome : 'Sem Editora'}"></td>

                    <td>
                        <span th:if="${jornal.ativo}" class="badge bg-success">Ativo</span>
                        <span th:unless="${jornal.ativo}" class="badge bg-danger">Inativo</span>
                    </td>

                    <td>
                        <a type="button" th:href="@{/jornal/editar/{id}(id=${jornal.idItemAcervo})}"
                           class="btn btn-warning btn-sm">Editar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="row mt-4 align-items-center">
                <div class="col text-start">
                    <a type="button" th:href="@{/#}" class="btn btn-primary">Voltar para a tela de início</a>
                </div>
                <div class="col text-center">
                    <a type="button" th:href="@{/jornal/jornalFormulario}" class="btn btn-success">Novo Jornal</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
