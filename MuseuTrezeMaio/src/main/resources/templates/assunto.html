<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Assuntos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-8">
                <!-- Formulario -->
                <div class="card card-hover border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">
                            <i class="bi bi-tags me-2" style="color: #2C5B37;"></i>
                            Cadastro de Assunto
                        </h4>

                        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">

                            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensagemSucesso}"></span>

                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form method="POST" th:action="@{/assunto/salvarAssunto}" th:object="${assunto}">
                            <input type="hidden" th:field="*{idAssunto}">

                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label for="descricao" class="form-label">Descrição <span class="text-danger">*</span> </label>
                                    <input type="text" id="descricao" class="form-control" placeholder="Digite a descrição do assunto" th:field="*{descricao}">
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('descricao')}"
                                         th:errors="*{descricao}">
                                    </div>
                                </div>
                                <div class="col-md-4 mb-3 d-flex align-items-center">
                                    <div class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" role="switch" id="ativo" th:field="*{ativo}" checked>
                                        <label class="form-check-label" for="ativo">Ativo</label>
                                    </div>
                                </div>
                            </div>
                            <hr class="my-4">
                            <div class="d-flex gap-2">
                                    <button type="submit" class="btn text-white" style="background-color: #2C5B37 "> <i class="bi bi-save me-2"></i> Salvar</button>
                                    <a th:href="@{/assunto/lista}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-2"></i>Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>


                <!-- Lista de Assuntos -->
                <div class="card card-hover border-0 shadow-sm mt-4">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0">
                                Assuntos Cadastrados
                            </h5>
                            <div style="max-width: 350px; width: 100%;">
                                <div class="input-group input-group-sm">
                                    <!-- Campo de Pesquisa -->
                                    <input type="text" id="inputPesquisa" oninput="pesquisaGlobal()" class="form-control" placeholder="Pesquisar assunto">

                                    <!-- Botão de Limpar (Exibe um "X" e o ícone de lixeira ou texto, usei o "x-lg" do Bootstrap Icons) -->
                                    <button class="btn btn-outline-secondary" type="button" onclick="limparPesquisa()" title="Limpar pesquisa">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="table-responsive" id="containerTabelaPaginada">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Descrição</th>
                                        <th>Status</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="assunto :${paginaAssuntos.content}">
                                        <td th:text="${assunto.descricao}" ></td>
                                        <td>
                                             <span th:if="${assunto.ativo}" class="badge bg-success">
                                                 Ativo
                                             </span>
                                             <span th:unless="${assunto.ativo}" class="badge bg-danger">
                                                 Inativo
                                             </span>
                                        </td>
                                        <td>
                                            <a th:href="@{/assunto/editar/{idAssunto}(idAssunto=${assunto.idAssunto})}"
                                               class="btn btn-sm btn-outline-warning me-3"> <i class="bi bi-pencil"></i>
                                            </a>
                                        </td>

                                    </tr>
                                </tbody>
                            </table>

                            <nav th:if="${paginaAssuntos.totalPages > 1}">
                                <ul class="pagination justify-content-center mt-3">

                                    <li class="page-item" th:classappend="${paginaAssuntos.first} ? 'disabled'">
                                        <a class="page-link " th:href="@{/assunto/lista(page=${paginaAssuntos.number - 1})}">
                                            Anterior
                                        </a>
                                    </li>

                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, paginaAssuntos.totalPages - 1)}"
                                        th:classappend="${i == paginaAssuntos.number} ? 'active'">
                                        <a class="page-link" th:text="${i + 1}" th:href="@{/assunto/lista(page=${i})}"></a>
                                    </li>

                                    <li class="page-item"
                                        th:classappend="${paginaAssuntos.last} ? 'disabled'">
                                        <a class="page-link" th:href="@{/assunto/lista(page=${paginaAssuntos.number + 1})}">
                                            Próxima
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                        <!-- 2. CONTAINER DA TABELA DE BUSCA GLOBAL (Inicia oculta) -->
                        <div class="table-responsive" id="containerTabelaBusca" style="display: none;">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th>Descrição</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                                </thead>
                                <tbody id="corpoResultadosBusca">
                                <!-- Gerado dinamicamente pelo JavaScript -->
                                </tbody>
                            </table>
                        </div>


                    </div>
                </div>

            </div>
        </div>
    </div>
    <!-- 3. CARREGAMENTO DOS DADOS NO HTML OCULTO (A PROVA DE FALHAS) -->
    <!-- O Thymeleaf gera elementos invisíveis contendo os atributos que o JavaScript precisa ler -->
    <div id="dados-assuntos-armazenados" style="display: none;">
        <div class="dado-assunto-item"
             th:each="assunto : ${todosAssuntos}"
             th:data-id="${assunto.idAssunto}"
             th:data-descricao="${assunto.descricao}"
             th:data-ativo="${assunto.ativo}">
        </div>
    </div>

    <!-- 4. SCRIPT DE FILTRAGEM DINÂMICA REFORMULADO -->
    <script>
        // Array global que armazenará os dados mapeados do HTML acima
        let todosOsAssuntos = [];

        // Esta função roda assim que o navegador carrega a página por completo
        document.addEventListener("DOMContentLoaded", function() {
            // Seleciona todos os elementos invisíveis gerados pelo Thymeleaf
            const elementosDados = document.querySelectorAll(".dado-assunto-item");

            elementosDados.forEach(elemento => {
                // Converte os atributos de texto 'data-' para tipos booleanos e inteiros corretos
                todosOsAssuntos.push({
                    idAssunto: elemento.getAttribute("data-id"),
                    descricao: elemento.getAttribute("data-descricao"),
                    ativo: elemento.getAttribute("data-ativo") === "true" // Converte string 'true' para booleano
                });
            });

            // Exibe no console do seu navegador quantos registros foram carregados para te ajudar a testar
            console.log("Busca digital inicializada com " + todosOsAssuntos.length + " assuntos carregados.");
        });

        function pesquisaGlobal() {
            console.log("Pesquisa executada")
            const termo = document.getElementById("inputPesquisa").value.trim().toLowerCase();
            const containerPaginado = document.getElementById("containerTabelaPaginada");
            const containerBusca = document.getElementById("containerTabelaBusca");
            const corpoResultados = document.getElementById("corpoResultadosBusca");

            console.log("containerPaginado:", containerPaginado);
            console.log("containerBusca:", containerBusca);
            console.log("corpoResultados:", corpoResultados);

            // Se o campo estiver vazio ou limpo, restaura a tabela original com paginação
            if (termo === "") {
                containerPaginado.style.display = "";
                containerBusca.style.display = "none";
                corpoResultados.innerHTML = "";
                return;
            }

            // Filtra os dados garantindo que a propriedade 'descricao' existe
            const filtrados = todosOsAssuntos.filter(assunto => {
                return assunto && assunto.descricao && assunto.descricao.toString().toLowerCase().includes(termo);
            });

            // Alterna a exibição das tabelas
            containerPaginado.style.display = "none";
            containerBusca.style.display = "";
            corpoResultados.innerHTML = "";

            if (filtrados.length === 0) {
                corpoResultados.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-3">Nenhum assunto encontrado para "${termo}".</td></tr>`;
                return;
            }

            // Reconstrói as linhas na tela respeitando o design original do Bootstrap
            filtrados.forEach(assunto => {
                const statusTexto = assunto.ativo ? 'Ativo' : 'Inativo';
                const badgeClasse = assunto.ativo ? 'bg-success' : 'bg-danger';

                const linhaHtml = `
                <tr>
                    <td>${assunto.descricao}</td>
                    <td>
                        <span class="badge ${badgeClasse}">${statusTexto}</span>
                    </td>
                    <td>
                        <a href="/assunto/editar/${assunto.idAssunto}" class="btn btn-sm btn-outline-warning me-3">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                </tr>
            `;
                corpoResultados.insertAdjacentHTML('beforeend', linhaHtml);
            });
        }

        function limparPesquisa() {
            const input = document.getElementById("inputPesquisa");

            // Altera o valor para vazio apenas se houver algo digitado
            if (input.value !== "") {
                input.value = "";

                // Dispara manualmente a função de pesquisa para que ela restaure a tabela original
                pesquisaGlobal();
            }
        }

    </script>




</body>
</html>
