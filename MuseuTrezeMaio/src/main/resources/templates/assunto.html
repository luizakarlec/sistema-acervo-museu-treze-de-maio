<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Assuntos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-8">
                <!-- Formulario -->
                <div class="card card-hover border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">
                            <i class="bi bi-tags me-2" style="color: #2C5B37;"></i>
                            Cadastro de Assunto
                        </h4>

                        <form method="POST" th:action="@{/assunto/salvarAssunto}" th:object="${assunto}">
                            <input type="hidden" th:field="*{idAssunto}">

                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label for="descricao" class="form-label">Descrição <span class="text-danger">*</span> </label>
                                    <input type="text" id="descricao" class="form-control" placeholder="Digite a descrição do assunto" th:field="*{descricao}">
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('descricao')}"
                                         th:errors="*{descricao}">
                                    </div>
                                </div>
                                <div class="col-md-4 mb-3 d-flex align-items-center">
                                    <div class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" role="switch" id="ativo" th:field="*{ativo}" checked>
                                        <label class="form-check-label" for="ativo">Ativo</label>
                                    </div>
                                </div>
                            </div>
                            <hr class="my-4">
                            <div class="d-flex gap-2">
                                    <button type="submit" class="btn text-white" style="background-color: #2C5B37 "> <i class="bi bi-save me-2"></i> Salvar</button>
                                    <a th:href="@{/assunto/lista}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-2"></i>Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>


                <!-- Lista de Assuntos -->
                <div class="card card-hover border-0 shadow-sm mt-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">
                            Assuntos Cadastrados
                        </h5>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Descrição</th>
                                        <th>Status</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="assunto :${assuntos}">
                                        <td th:text="${assunto.descricao}" ></td>
                                        <td>
                                             <span th:if="${assunto.ativo}" class="badge bg-success">
                                                 Ativo
                                             </span>
                                             <span th:unless="${assunto.ativo}" class="badge bg-danger">
                                                 Inativo
                                             </span>
                                        </td>
                                        <td>
                                            <a th:href="@{/assunto/editar/{idAssunto}(idAssunto=${assunto.idAssunto})}"
                                               class="btn btn-sm btn-outline-warning me-3"> <i class="bi bi-pencil"></i>
                                            </a>
                                        </td>

                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
