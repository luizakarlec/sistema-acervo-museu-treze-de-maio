<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Colaborador Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container mt-4 mb-3">
    <div class="row justify-content-center">
        <!-- Esta div controla a largura do quadro cinza (col-md-8) -->
        <div class="col-md-6 bg-light p-3 rounded shadow-sm">
            <h1 class="text-center mt-0">Cadastro de Colaboradores</h1>

            <form method="POST" th:action="@{/colaborador/salvarColaborador}" th:object="${colaborador}">
                <input type="hidden" th:field="*{idColaborador}">
                <div class="alert alert-danger"
                     th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}"
                       th:text="${err}"></p>
                </div>

                <div class="row mb-3 align-items-center">
                    <label for="nome" class="col-sm-2 col-form-label text-sm-end">Nome:</label>
                    <div class="col-sm-8">
                        <input type="text" id="nome" class="form-control" th:field="*{nome}">
                    </div>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('nome')}"
                         th:errors="*{nome}">
                    </div>
                </div>
                <div class="row mb-3 align-items-center">
                    <label for="sobrenome" class="col-sm-2 col-form-label text-sm-end">Sobrenome:</label>
                    <div class="col-sm-8">
                        <input type="text" id="sobrenome" class="form-control" th:field="*{sobrenome}">
                    </div>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('sobrenome')}"
                         th:errors="*{sobrenome}">
                    </div>
                </div>
                <div class="row mb-3 align-items-center">
                    <label for="nacionalidade" class="col-sm-2 col-form-label text-sm-end">Nacionalidade:</label>
                    <div class="col-sm-8">
                        <input type="text" id="nacionalidade" class="form-control" th:field="*{nacionalidade}">
                    </div>
                </div>
                <div class="row mb-3 align-items-center">
                    <label for="tipo" class="col-sm-2 col-form-label text-sm-end">Tipo:</label>
                    <div class="col-sm-8">
                        <select id="tipo" class="form-select"  th:field="*{tipo}">
                            <option value="" >Selecione um tipo</option>
                            <option value="Autor">Autor</option>
                            <option value="Colaborador">Colaborador</option>
                            <option value="Editor">Editor</option>
                            <option value="Ilustrador">Ilustrador</option>
                            <option value="Organizador">Organizador</option>
                            <option value="Tradutor">Tradutor</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('tipo')}"
                         th:errors="*{tipo}">
                    </div>
                </div>
                <div >
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="ativo" th:field="*{ativo}" checked>
                        <label class="form-check-label" for="ativo">Ativo</label>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col text-star">
                        <a type="button" th:href="@{/colaborador/colaboradorLista}" class="btn btn-primary">Voltar</a>
                    </div>
                    <div class="col text-center">
                        <button type="reset" class="btn btn-secondary">Limpar</button>
                        <button type="submit" class="btn btn-success me-2">Cadastrar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    </div>

</body>
</html>
