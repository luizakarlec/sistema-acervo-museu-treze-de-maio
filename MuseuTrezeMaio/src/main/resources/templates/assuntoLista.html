<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Assuntos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container mt-4 ">
        <div class="row me-0 ">
            <div class="col-md-8 bg-light p-3 rounded shadow-sm "> <!-- controla o tamanho aqui -->
                <h1>Lista de Assuntos</h1>
                <!---<div th:if="${erro}" class="alert alert-danger">
                    <p th:text="${erro}"></p>
                </div>-->

                <form class="d-flex w-80 mb-3" role="search" th:action="@{/assunto/pesquisarAssunto}" method="GET">
                    <div class="input-group">
                        <input type="search" name="descricao" th:value="${descricaoPesquisada}" class="form-control" placeholder="Buscar por descrição" aria-label="Pesquisar">

                        <button class="btn btn-outline-primary" type="submit">Pesquisar</button>
                        <a th:if="${descricaoPesquisada != null and !descricaoPesquisada.isEmpty()}" th:href="@{/assunto/assuntoLista}" class="btn btn-outline-secondary">Limpar</a>
                    </div>
                </form>


                <table class="table">
                    <tr>
                        <!---<th>Id</th>-->
                        <th>Descricao</th>
                        <th>Situação</th>
                        <th>Editar</th>

                    </tr>
                    <tr th:each="assunto :${assuntos}">
                        <!--- <td th:text="${assunto.idAssunto}" ></td>-->
                         <td th:text="${assunto.descricao}" ></td>
                         <td>
                             <span th:if="${assunto.ativo}" class="badge bg-success">
                                 Ativo
                             </span>

                             <span th:unless="${assunto.ativo}" class="badge bg-danger">
                                 Inativo
                             </span>
                         </td>
                         <td>
                             <a type="button" th:href="@{/assunto/editar/{idAssunto}(idAssunto=${assunto.idAssunto})}"
                                class="btn btn-warning">Editar
                             </a>
                         </td>

                     </tr>
                 </table>
                 <div class="row mt-4 align-items-center">
                     <div class="col text-star">
                         <a type="button" th:href="@{/#}" class="btn btn-primary">Voltar para a tela de inicio </a>
                     </div>
                     <div class=" col text-center">
                         <a type="button" th:href="@{/assunto/assuntoFormulario}" class="btn btn-success">Novo Assunto </a>
                     </div>
                 </div>
             </div>
         </div>
     </div>
 </body>
 </html>
