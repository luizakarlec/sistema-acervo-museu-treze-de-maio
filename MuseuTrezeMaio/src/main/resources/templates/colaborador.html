<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Colaborador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-8">
                <!-- Formulario -->
                <div class="card card-hover border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">
                            <i class="bi bi-person-badge me-2" style="color: #2C5B37;"></i>
                            Cadastro de Colaborador
                        </h4>

                        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">

                            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensagemSucesso}"></span>

                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form method="POST" th:action="@{/colaborador/salvarColaborador}" th:object="${colaborador}">
                            <input type="hidden" th:field="*{idColaborador}">

                            <div class="alert alert-danger"
                                 th:if="${#fields.hasGlobalErrors()}">
                                <p th:each="err : ${#fields.globalErrors()}"
                                   th:text="${err}"></p>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nome" class="form-label">Nome <span class="text-danger">*</span> </label>
                                    <input type="text" id="nome" class="form-control" placeholder="Digite o nome" th:field="*{nome}">
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('nome')}"
                                         th:errors="*{nome}">
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="sobrenome" class="form-label">Sobrenome <span class="text-danger">*</span> </label>
                                    <input type="text" id="sobrenome" class="form-control" placeholder="Digite o nome" th:field="*{sobrenome}">
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('sobrenome')}"
                                         th:errors="*{sobrenome}">
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="tipo" class="form-label">Tipo <span class="text-danger">*</span> </label>
                                    <select id="tipo" class="form-select"  th:field="*{tipo}">
                                        <option value="" >Selecione o tipo</option>
                                        <option value="Autor">Autor</option>
                                        <option value="Colaborador">Colaborador</option>
                                        <option value="Editor">Editor</option>
                                        <option value="Ilustrador">Ilustrador</option>
                                        <option value="Organizador">Organizador</option>
                                        <option value="Tradutor">Tradutor</option>
                                        <option value="Outro">Outro</option>
                                    </select>
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('tipo')}"
                                         th:errors="*{tipo}">
                                    </div>

                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="nacionalidade" class="form-label">Nacionalidade </label>
                                    <input type="text" id="nacionalidade" class="form-control" placeholder="Digite a nacionalidade " th:field="*{nacionalidade}">

                                </div>

                                <div class="col-md-4 mb-3 d-flex align-items-center">
                                    <div class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" role="switch" id="ativo" th:field="*{ativo}" checked>
                                        <label class="form-check-label" for="ativo">Ativo</label>
                                    </div>
                                </div>

                            </div>
                            <hr class="my-4">
                            <div class="d-flex gap-2">
                                    <button type="submit" class="btn text-white" style="background-color: #2C5B37 "> <i class="bi bi-save me-2"></i> Salvar</button>
                                    <a th:href="@{/editora/lista}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-2"></i>Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>


                <!-- Lista de Colaboradores -->
                <div class="card card-hover border-0 shadow-sm mt-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">
                            Colaboradores cadastrados
                        </h5>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Nome Completo</th>
                                        <th>Tipo</th>
                                        <th>Nacionalidade</th>
                                        <th>Status</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="colaborador :${paginaColaboradores.content}">
                                        <td th:text="${colaborador.nome + ' ' + colaborador.sobrenome}"></td>
                                        <td th:text="${colaborador.tipo}"></td>
                                        <td th:text="${colaborador.nacionalidade}"></td>
                                        <td>
                                             <span th:if="${colaborador.ativo}" class="badge bg-success">Ativo</span>
                                             <span th:unless="${colaborador.ativo}" class="badge bg-danger">Inativo</span>
                                        </td>
                                        <td>
                                            <a th:href="@{/colaborador/editar/{idColaborador}(idColaborador=${colaborador.idColaborador})}"
                                               class="btn btn-sm btn-outline-warning me-3"> <i class="bi bi-pencil"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                            <nav th:if="${paginaColaboradores.totalPages > 1}">
                                <ul class="pagination justify-content-center mt-3">

                                    <li class="page-item" th:classappend="${paginaColaboradores.first} ? 'disabled'">
                                        <a class="page-link " th:href="@{/colaborador/lista(page=${paginaColaboradores.number - 1})}">
                                            Anterior
                                        </a>
                                    </li>

                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, paginaColaboradores.totalPages - 1)}"
                                        th:classappend="${i == paginaColaboradores.number} ? 'active'">
                                        <a class="page-link" th:text="${i + 1}" th:href="@{/colaborador/lista(page=${i})}"></a>
                                    </li>

                                    <li class="page-item"
                                        th:classappend="${paginaColaboradores.last} ? 'disabled'">
                                        <a class="page-link" th:href="@{/colaborador/lista(page=${paginaColaboradores.number + 1})}">
                                            Próxima
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



</body>
</html>
