<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="headerSuperior">

    <nav class="navbar navbar-expand-lg" style="background-color: #2C5B37;">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center text-white fw-bold" th:href="@{/}">
                <i class="bi bi-buildings me-2 fs-5"></i>Museu Treze de Maio
            </a>
            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navTop">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navTop">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Início</a>
                    </li>
                    <!--
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" th:href="@{/pesquisa}"><i class="bi bi-search me-1"></i>Pesquisar</a>
                    </li>
                    -->
                    <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','BIBLIOTECARIO')">
                        <a class="nav-link text-white" th:href="@{/admin}"><i class="bi bi-gear me-1"></i>Administração</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link text-white" th:href="@{/login}"><i class="bi bi-person-circle me-1"></i>Login</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="POST" class="m-0">
                            <button type="submit" class="btn btn-sm btn-outline-light ms-2">
                                <i class="bi bi-box-arrow-right me-1"></i>Sair
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</th:block>

</html>
