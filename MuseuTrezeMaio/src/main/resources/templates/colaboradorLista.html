<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Colaboradores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container mt-4 ">
        <div class="row me-0 ">
            <div class="col-md-8 bg-light p-3 rounded shadow-sm "> <!-- controla o tamanho aqui -->
                <h1>Lista de Colaboradores</h1>
                <!---<div th:if="${erro}" class="alert alert-danger">
                    <p th:text="${erro}"></p>
                </div>-->
                <table class="table">
                    <tr>
                        <!---<th>Id</th>-->
                        <th>Nome</th>
                        <th>Sobrenome</th>
                        <th>Nacionalidade</th>
                        <th>Tipo</th>
                        <th>Situação</th>
                        <th>Editar</th>

                    </tr>
                    <tr th:each="colaborador :${colaboradores}">
                        <!--- <td th:text="${assunto.idAssunto}" ></td>-->
                        <td th:text="${colaborador.nome}" ></td>
                        <td th:text="${colaborador.sobrenome}" ></td>
                        <td th:text="${colaborador.nacionalidade}" ></td>
                        <td th:text="${colaborador.tipo}" ></td>

                        <td>
                                 <span th:if="${colaborador.ativo}" class="badge bg-success">
                                     Ativo
                                 </span>

                            <span th:unless="${colaborador.ativo}" class="badge bg-danger">
                                     Inativo
                                 </span>
                        </td>
                        <td>
                            <a type="button" th:href="@{/colaborador/editar/{idColaborador}(idColaborador=${colaborador.idColaborador})}"
                               class="btn btn-warning">Editar
                            </a>
                        </td>

                    </tr>
                </table>
                <div class="row mt-4 align-items-center">
                    <div class="col text-star">
                        <a type="button" th:href="@{/#}" class="btn btn-primary">Voltar para a tela de inicio </a>
                    </div>
                    <div class=" col text-center">
                        <a type="button" th:href="@{/colaborador/colaboradorFormulario}" class="btn btn-success">Novo Colaborador </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
