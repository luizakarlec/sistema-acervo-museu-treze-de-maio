<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Revistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensagemSucesso}">
        <span th:text="${mensagemSucesso}">Operação realizada com sucesso!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-sm-center gap-3 mb-4">
                        <h4 class="fw-bold mb-0 text-nowrap">
                            <i class="bi bi-newspaper me-2" style="color: #2C5B37;"></i>
                            Revistas Cadastradas
                        </h4>

                        <div class="d-flex gap-2 w-100 w-sm-auto justify-content-end">
                            <a th:href="@{/revista/revistaFormulario}" class="btn text-white" style="background-color: #2C5B37;">
                                <i class="bi bi-plus-circle me-2"></i>Nova Revista
                            </a>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>Código</th>
                                <th>Título</th>
                                <th>Número</th>
                                <th>Volume</th>
                                <th>Ano/Mês</th>
                                <th>Status</th>
                                <th class="text-center" style="width: 120px;">Ações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="revista : ${listaRevistas}">
                                <td class="fw-semibold" th:text="${revista.codigoRevista}">REV-2024-001</td>
                                <td>
                                    <span class="d-block fw-bold text-dark" th:text="${revista.titulo}">Título de Revista</span>
                                    <small class="text-muted" th:text="${revista.subtitulo}">Subtítulo aqui</small>
                                </td>
                                <td th:text="${revista.edicao}">12</td>
                                <td th:text="${revista.volume}">12</td>
                                <td th:text="${revista.mes != null} ? |${revista.ano}/${#numbers.formatInteger(revista.mes, 2)}| : ${revista.ano}">2026/06</td>
                                <td>
                                    <span th:if="${revista.status == 'Ativo'}" class="badge bg-success text-white">Ativo</span>
                                    <span th:if="${revista.status == 'Inativo'}" class="badge bg-danger text-white">Inativo</span>
                                    <span th:if="${revista.status == 'Restauração'}" class="badge bg-warning text-dark">Restauração</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/revista/editar/{idItemAcervo}(idItemAcervo=${revista.idItemAcervo})}" class="btn btn-sm btn-outline-warning" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(listaRevistas)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    <i class="bi bi-folder-x display-4 d-block mb-2"></i>
                                    Nenhuma revista encontrada no acervo.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
