<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Jornal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
<div class="container mt-4 mb-3">
    <div class="row justify-content-center">
        <div class="col-md-8 bg-light p-4 rounded shadow-sm">
            <h1 class="text-center mt-0 mb-4">Cadastro de Jornal</h1>

            <form method="POST" th:action="@{/jornal/salvarJornal}" th:object="${jornal}" enctype="multipart/form-data">
                <input type="hidden" th:field="*{idItemAcervo}">

                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="codigoJornal" class="form-label">Código do Jornal *</label>
                        <input type="text" id="codigoJornal" class="form-control" th:field="*{codigoJornal}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('codigoJornal')}" th:errors="*{codigoJornal}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="data" class="form-label">Data de Publicação</label>
                        <input type="date" id="data" class="form-control" th:field="*{data}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="titulo" class="form-label">Título *</label>
                        <input type="text" id="titulo" class="form-control" th:field="*{titulo}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="subtitulo" class="form-label">Subtítulo</label>
                        <input type="text" id="subtitulo" class="form-control" th:field="*{subtitulo}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('subtitulo')}" th:errors="*{subtitulo}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="edicao" class="form-label">Edição</label>
                        <input type="text" id="edicao" class="form-control" th:field="*{edicao}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('edicao')}" th:errors="*{edicao}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="numeroPaginas" class="form-label">Nº de Páginas</label>
                        <input type="number" id="numeroPaginas" class="form-control" th:field="*{numeroPaginas}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('numeroPaginas')}" th:errors="*{numeroPaginas}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="idioma" class="form-label">Idioma *</label>
                        <input type="text" id="idioma" class="form-control" th:field="*{idioma}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('idioma')}" th:errors="*{idioma}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="tipo" class="form-label">Tipo de Item *</label>
                        <input type="text" id="tipo" class="form-control" th:field="*{tipo}" placeholder="Ex: Jornal Físico / Digital">
                        <div class="text-danger small" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="localizacaoAcervo" class="form-label">Localização no Acervo (Prateleira/Corredor)</label>
                        <input type="text" id="localizacaoAcervo" class="form-control" th:field="*{localizacaoAcervo}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('localizacaoAcervo')}" th:errors="*{localizacaoAcervo}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="editora" class="form-label">Editora *</label>
                        <select id="editora" class="form-select" th:field="*{editora}">
                            <option value="">Selecione uma editora...</option>
                            <option th:each="ed : ${listaEditoras}"
                                    th:value="${ed.idEditora}"
                                    th:text="${ed.nome}"></option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('editora')}" th:errors="*{editora}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="cidade" class="form-label">Cidade de Origem</label>
                        <input type="text" id="cidade" class="form-control" th:field="*{localizacao.cidade}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('localizacao.cidade')}" th:errors="*{localizacao.cidade}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="estado" class="form-label">Estado de Origem</label>
                        <input type="text" id="estado" class="form-control" th:field="*{localizacao.estado}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('localizacao.estado')}" th:errors="*{localizacao.estado}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="status" class="form-label">Status de Conservação / Disponibilidade *</label>
                        <input type="text" id="status" class="form-control" th:field="*{status}" placeholder="Ex: Disponível, Danificado, Restaurando">
                        <div class="text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-12">
                        <label for="fileCapa" class="form-label">Imagem da Capa (Opcional)</label>
                        <input type="file" id="fileCapa" name="fileCapa" class="form-control" accept="image/*">
                    </div>
                </div>

                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="ativo" th:field="*{ativo}" checked>
                        <label class="form-check-label" for="ativo">Registro Ativo</label>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col text-start">
                        <a type="button" th:href="@{/jornal/jornalLista}" class="btn btn-primary">Voltar</a>
                    </div>
                    <div class="col text-end">
                        <button type="reset" class="btn btn-secondary me-2">Limpar</button>
                        <button type="submit" class="btn btn-success">Cadastrar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
