<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário | Museu Treze de Maio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        #admin-sidebar {
            width: 260px; min-width: 260px;
            background-color: #2C5B37;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }
        .sidebar-link { color: rgba(255,255,255,.85); border-radius: 8px; display: flex;
            align-items: center; gap: .5rem; padding: .45rem .85rem; text-decoration: none; }
        .sidebar-link:hover { background-color: rgba(255,255,255,.18); color: #fff; }
        .sidebar-link.active { background-color: rgba(255,255,255,.22); color: #fff; font-weight: 600; }
        .submenu-toggle { background: none; border: none; }
        .submenu-link { color: rgba(255,255,255,.8); border-radius: 8px; display: flex; align-items: center;
            gap: .5rem; padding: .38rem .85rem .38rem 2.2rem; text-decoration: none; font-size: .88rem; }
        .submenu-link:hover { background-color: rgba(255,255,255,.15); color: #fff; }
        .submenu-link.active { background-color: rgba(255,255,255,.2); color: #fff; font-weight: 600; }
        .submenu-chevron { margin-left: auto; transition: transform .25s; font-size: .75rem; }
        .form-label { font-weight: 500; color: #495057; }
        .required::after { content: " *"; color: #dc3545; }
        .btn-primary-custom { background-color: #2C5B37; color: white; border: none; }
        .btn-primary-custom:hover { background-color: #214429; color: white; }
    </style>
</head>
<body class="bg-light">
<div class="d-flex" style="min-height:100vh;">

    <!-- ═══ SIDEBAR ADMIN ═══ -->
    <div id="admin-sidebar" class="flex-shrink-0 p-3">
        <a th:href="@{/}" class="d-flex align-items-center mb-3 text-white text-decoration-none gap-2">
            <i class="bi bi-buildings fs-4"></i>
            <span class="fs-5 fw-bold">Admin</span>
        </a>
        <hr style="border-color:rgba(255,255,255,.3);">
        <ul class="nav flex-column mb-auto gap-1">
            <li><a th:href="@{/admin}" class="sidebar-link"><i class="bi bi-speedometer2"></i>Painel</a></li>
            <li><a th:href="@{/}" class="sidebar-link"><i class="bi bi-house-door"></i>Ir para o Site</a></li>
            <li><hr style="border-color:rgba(255,255,255,.2); margin:.4rem 0;"></li>
            <li>
                <button class="sidebar-link submenu-toggle w-100"
                        data-bs-toggle="collapse" data-bs-target="#adminSubmenu" aria-expanded="true">
                    <i class="bi bi-gear-fill"></i><span>Administração</span>
                    <i class="bi bi-chevron-down submenu-chevron"></i>
                </button>
                <div class="collapse show" id="adminSubmenu">
                    <ul class="nav flex-column gap-1 mt-1">
                        <li><a th:href="@{/assunto/lista}"        class="submenu-link"><i class="bi bi-tags"></i>Assuntos</a></li>
                        <li><a th:href="@{/colaborador/lista}"    class="submenu-link"><i class="bi bi-person-badge"></i>Colaboradores</a></li>
                        <li><a th:href="@{/editora/lista}"        class="submenu-link"><i class="bi bi-building"></i>Editoras</a></li>
                        <li><a th:href="@{/jornal/jornalLista}"   class="submenu-link"><i class="bi bi-newspaper"></i>Jornais</a></li>
                        <li><a th:href="@{/livro/livroLista}"     class="submenu-link"><i class="bi bi-book"></i>Livros</a></li>
                        <li><a th:href="@{/revista/revistaLista}" class="submenu-link"><i class="bi bi-journal"></i>Revistas</a></li>
                        <li><a th:href="@{/exemplar/exemplarLista}" class="submenu-link"><i class="bi bi-journal"></i>Exemplares</a></li>
                        <li sec:authorize="hasAuthority('ADMIN')"><a th:href="@{/usuario/usuarioLista}" class="submenu-link active"><i class="bi bi-people"></i>Usuários</a></li>
                    </ul>
                </div>
            </li>
        </ul>
        <hr style="border-color:rgba(255,255,255,.3); margin-top:auto;">
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle gap-2"
               data-bs-toggle="dropdown">
                <i class="bi bi-person-circle fs-4"></i>
                <span sec:authentication="name">Usuário</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark shadow">
                <li>
                    <form th:action="@{/logout}" method="POST">
                        <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Sair</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>

    <!-- ═══ CONTEÚDO ═══ -->
    <div class="flex-grow-1">
        <div class="bg-white shadow-sm px-4 py-3 mb-4 d-flex align-items-center gap-3">
            <a th:href="@{/usuario}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Voltar para Usuários
            </a>
            <h5 class="mb-0 fw-bold">
                <i class="bi bi-person-plus-fill me-2" style="color:#2C5B37;"></i>
                <span th:text="${usuario.idUsuario > 0} ? 'Editar Usuário' : 'Cadastrar Usuário'">Cadastrar Usuário</span>
            </h5>
        </div>

        <div class="container-fluid px-4 pb-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <form th:action="@{/usuario/salvarUsuario}" th:object="${usuario}" method="POST">
                        <input type="hidden" th:field="*{idUsuario}">

                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nome" class="form-label required">Nome</label>
                                <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Nome">
                                <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="sobrenome" class="form-label required">Sobrenome</label>
                                <input type="text" class="form-control" id="sobrenome" th:field="*{sobrenome}" placeholder="Sobrenome">
                                <div class="text-danger small" th:if="${#fields.hasErrors('sobrenome')}" th:errors="*{sobrenome}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label required">E-mail</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="seu@email.com">
                                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="senha" class="form-label required">Senha</label>
                                <input type="password" class="form-control" id="senha" th:field="*{senha}" placeholder="••••••••">
                                <div class="text-danger small" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                                <small class="text-muted" th:if="${usuario.idUsuario > 0}">Deixe em branco para manter a senha atual.</small>
                            </div>

                            <div class="col-md-6">
                                <label for="tipo" class="form-label required">Tipo de Usuário</label>
                                <select id="tipo" class="form-select" th:field="*{tipo}">
                                    <option value="">Selecione...</option>
                                    <option value="ADMIN">Administrador</option>
                                    <option value="BIBLIOTECARIO">Bibliotecário</option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                            </div>

                            <div class="col-md-6 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" role="switch" id="ativo" th:field="*{ativo}">
                                    <label class="form-check-label" for="ativo">Usuário ativo</label>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/usuario/usuarioLista}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-2"></i>Voltar para Lista
                            </a>
                            <div class="d-flex gap-2">
                                <button type="reset" class="btn btn-light border">
                                    <i class="bi bi-eraser me-2"></i>Limpar
                                </button>
                                <button type="submit" class="btn btn-primary-custom px-4">
                                    <i class="bi bi-save me-2"></i>
                                    <span th:text="${usuario.idUsuario > 0} ? 'Atualizar Usuário' : 'Cadastrar Usuário'">Cadastrar Usuário</span>
                                </button>
                            </div>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
