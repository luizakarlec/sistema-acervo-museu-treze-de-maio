<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Revistas | Sistema de Acervo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 12px; }
        .btn-primary-custom { background-color: #2C5B37; color: white; border: none; }
        .btn-primary-custom:hover { background-color: #214429; color: white; }
        .form-label { font-weight: 500; color: #495057; }
        .required::after { content: " *"; color: #dc3545; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <div class="d-flex align-items-center mb-4">
                        <i class="bi bi-newspaper fs-2 me-3" style="color: #2C5B37;"></i>
                        <h4 class="fw-bold mb-0">Cadastro de Revista</h4>
                    </div>

                    <form th:action="@{/revista/salvarRevista}" th:object="${revista}" method="POST" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{idItemAcervo}">
                        <input type="hidden" th:field="*{tipo}">

                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="codigoRevista" class="form-label required">Código da Revista</label>
                                <input type="text" class="form-control" id="codigoRevista" th:field="*{codigoRevista}" placeholder="Ex: REV-2024-001">
                                <div class="text-danger small" th:if="${#fields.hasErrors('codigoRevista')}" th:errors="*{codigoRevista}"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="edicao" class="form-label">Número</label>
                                <input type="text" class="form-control" id="edicao" th:field="*{edicao}" placeholder="Número ou Identificador">
                                <div class="text-danger small" th:if="${#fields.hasErrors('edicao')}" th:errors="*{edicao}"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="ISSN" class="form-label">ISSN</label>
                                <input type="text" class="form-control" id="ISSN" th:field="*{ISSN}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('ISSN')}" th:errors="*{ISSN}"></div>
                            </div>

                            <div class="col-md-12">
                                <label for="titulo" class="form-label required">Título</label>
                                <input type="text" class="form-control" id="titulo" th:field="*{titulo}" placeholder="Título principal da publicação">
                                <div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                            </div>

                            <div class="col-12">
                                <label for="subtitulo" class="form-label">Subtítulo</label>
                                <input type="text" class="form-control" id="subtitulo" th:field="*{subtitulo}" placeholder="Subtítulo ou manchete secundária">
                            </div>

                            <div class="col-md-2">
                                <label for="ano" class="form-label required">Ano de Publicação</label>
                                <input type="number" class="form-control" id="ano" th:field="*{ano}" placeholder="0">
                                <div class="text-danger small" th:if="${#fields.hasErrors('ano')}" th:errors="*{ano}"></div>
                            </div>

                            <div class="col-md-2">
                                <label for="mes" class="form-label">Mês de Publicação</label>
                                <input type="number" class="form-control" id="mes" th:field="*{mes}" placeholder="0">
                                <div class="text-danger small" th:if="${#fields.hasErrors('mes')}" th:errors="*{mes}"  ></div>
                            </div>

                            <div class="col-md-4">
                                <label for="volume" class="form-label">Volume</label>
                                <input type="text" class="form-control" id="volume" th:field="*{volume}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('volume')}" th:errors="*{volume}"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="periodicidade" class="form-label">Periodicidade</label>
                                <input type="text" class="form-control" id="periodicidade" th:field="*{periodicidade}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('periodicidade')}" th:errors="*{periodicidade}"></div>
                            </div>

                            <div class="col-12">
                                <label for="descricao" class="form-label">Descrição / Resumo</label>
                                <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="3" placeholder="Breve descrição do conteúdo da revista..."></textarea>
                            </div>

                            <div class="col-md-3">
                                <label for="numeroPaginas" class="form-label">Nº de Páginas</label>
                                <input type="number" class="form-control" id="numeroPaginas" th:field="*{numeroPaginas}" placeholder="0">
                            </div>

                            <div class="col-md-3">
                                <label for="idioma" class="form-label required">Idioma</label>
                                <input type="text" class="form-control" id="idioma" th:field="*{idioma}" placeholder="Ex: Português">
                            </div>

                            <div class="col-md-6">
                                <label for="localizacaoAcervo" class="form-label required">Localização no Acervo</label>
                                <input type="text" class="form-control" id="localizacaoAcervo" th:field="*{localizacaoAcervo}" placeholder="Estante - Prateleira - Caixa">
                            </div>

                            <div class="col-md-6">
                                <label for="editora" class="form-label">Editora</label>
                                <select id="editora" class="form-select" th:field="*{editora}">
                                    <option value="">Selecione uma editora...</option>
                                    <option th:each="ed : ${listaEditoras}" th:value="${ed.idEditora}" th:text="${ed.nome}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="fileCapa" class="form-label">Upload da Capa</label>
                                <input type="file" id="fileCapa" name="fileCapa" class="form-control" accept="image/*">

                                <div th:if="${revista.capa != null and revista.capa.length > 0}" class="mt-2">
                                    <small class="text-muted d-block mt-1">
                                        <i class="bi bi-file-earmark-check me-1.5 fs-6"></i>
                                        Imagem de capa já cadastrada
                                    </small>
                                </div>
                                <!--<small class="text-muted d-block mt-1">JPG ou PNG (máx. 2MB).</small>-->
                            </div>

                            <div class="col-12">
                                <label for="notas" class="form-label">Notas</label>
                                <textarea class="form-control" id="notas" th:field="*{notas}" rows="2"></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label d-block mb-2">Visibilidade</label>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="visibilidadeNotas" th:field="*{visibilidadeNotas}">
                                    <label class="form-check-label" for="visibilidadeNotas">Notas visíveis para usuários</label>
                                </div>
                            </div>

                            <div class="col-md-6 text-md-end">
                                <label class="form-label d-block mb-2 required">Status do Item</label>
                                <div class="btn-group" role="group" aria-label="Status selection">
                                    <input type="radio" class="btn-check" id="statusAtivo" th:field="*{status}" value="Ativo">
                                    <label class="btn btn-outline-success" for="statusAtivo">Ativo</label>

                                    <input type="radio" class="btn-check" id="statusInativo" th:field="*{status}" value="Inativo">
                                    <label class="btn btn-outline-danger" for="statusInativo">Inativo</label>

                                    <input type="radio" class="btn-check" id="statusRestauracao" th:field="*{status}" value="Restauração">
                                    <label class="btn btn-outline-warning" for="statusRestauracao">Restauração</label>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/revista/revistaLista}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-2"></i>Voltar para Lista
                            </a>
                            <div class="d-flex gap-2">
                                <button type="reset" class="btn btn-light border">
                                    <i class="bi bi-eraser me-2"></i>Limpar
                                </button>
                                <button type="submit" class="btn btn-primary-custom px-4">
                                    <i class="bi bi-save me-2"></i>Cadastrar Revista
                                </button>
                            </div>
                        </div>
                    </form>

                </div>
            </div> </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
