<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Museu Treze de Maio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div class="card login-card">
    <div class="card-body">


        <div class="row align-items-center mb-4">

            <!-- Texto -->
            <div class="col-8 text-center">
                <h1 class="fw-bold mb-1">Museu Treze <br>de Maio</h1>
                <p class="login-subtitulo mb-0">
                    Acesso ao sistema do acervo
                </p>
            </div>

            <!-- Logo -->
            <div class="col-3 text-end">
                <img th:src="@{/images/museu.jpeg}"
                     alt="Museu Treze de Maio"
                     class="login-logo-img">
            </div>

        </div>
        <!-- Erro de autenticação (Spring Security envia ?error) -->
        <div class="alert alert-danger py-2 d-flex align-items-center gap-2" th:if="${param.error}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>E-mail ou senha incorretos.</span>
        </div>

        <!-- Mensagem de logout -->
        <div class="alert alert-success py-2 d-flex align-items-center gap-2" th:if="${param.logout}">
            <i class="bi bi-check-circle-fill"></i>
            <span>Você saiu com sucesso.</span>
        </div>

        <form method="POST" th:action="@{/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label for="username" class="form-label">E-mail</label>
                <input type="email" id="username" name="username" class="form-control"
                       placeholder="seu@email.com" autofocus required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-museu w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
            </button>
        </form>

        <a th:href="@{/}" class="voltar-link">
            <i class="bi bi-arrow-left me-1"></i>Voltar para a página inicial
        </a>

    </div>
</div>
</body>
</html>
