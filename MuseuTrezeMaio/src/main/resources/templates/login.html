<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — Museu Treze de Maio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f2f5;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        }
        .login-card .card-body {
            padding: 2.5rem 2rem;
        }
        .login-logo {
            font-size: 1.35rem;
            font-weight: 700;
            color: #212529;
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .login-subtitulo {
            font-size: 0.85rem;
            color: #6c757d;
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

<div class="card login-card">
    <div class="card-body">

        <div class="login-logo">Museu Treze de Maio</div>
        <div class="login-subtitulo">Acesso ao sistema de acervo</div>

        <!-- Erro de autenticação (Spring Security envia ?error) -->
        <div class="alert alert-danger py-2" th:if="${param.error}">
            E-mail ou senha incorretos.
        </div>

        <!-- Mensagem de logout -->
        <div class="alert alert-success py-2" th:if="${param.logout}">
            Você saiu com sucesso.
        </div>

        <form method="POST" th:action="@{/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label for="username" class="form-label">E-mail</label>
                <input type="email" id="username" name="username" class="form-control"
                       placeholder="seu@email.com" autofocus required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

    </div>
</div>
</body>
</html>
